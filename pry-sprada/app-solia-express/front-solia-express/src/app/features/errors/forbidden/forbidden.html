<main class="flex min-h-screen items-center justify-center bg-slate-100 px-4 py-10">
  <section class="w-full max-w-lg">
    <div class="rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm sm:p-10">
      <div class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-2xl bg-red-50 text-red-600">
        <i class="pi pi-lock text-4xl" aria-hidden="true"></i>
      </div>

      <p class="text-sm font-semibold tracking-widest text-red-600">
        ERROR 403
      </p>

      <h1 class="mt-3 text-2xl font-bold tracking-tight text-slate-900">
        Acceso denegado
      </h1>

      <p class="mt-3 text-sm leading-6 text-slate-500">
        No tienes permisos para acceder a este recurso.
        Si consideras que necesitas acceso, comunícate con el administrador
        del Fondo Solidario.
      </p>

      <button
        type="button"
        (click)="logout()"
        class="mt-8 inline-flex items-center justify-center gap-2 rounded-lg bg-blue-700 px-5 py-3 text-sm font-semibold text-white transition-colors hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
      >
        <i class="pi pi-sign-out" aria-hidden="true"></i>
        Cerrar sesión
      </button>

      <p class="mt-8 text-xs text-slate-400">
        Solia Express · Gestión del Fondo Solidario
      </p>
    </div>
  </section>
</main>
