<form
  [formGroup]="form"
  (ngSubmit)="submit()"
  class="space-y-4"
>
  <div>
    <label
      for="member-name"
      class="mb-1 block text-sm font-medium text-slate-700"
    >
      Nombre del socio <span class="text-red-500">*</span>
    </label>

    <input
      id="member-name"
      pInputText
      formControlName="name"
      placeholder="Nombre del socio"
      autocomplete="name"
      class="w-full"
    />

    @if (form.controls.name.touched && form.controls.name.invalid) {
      <p-message
        severity="error"
        size="small"
        variant="simple"
        styleClass="mt-1"
      >
        El nombre es obligatorio y debe tener máximo 120 caracteres.
      </p-message>
    }
  </div>

  <div>
    <label
      for="member-description"
      class="mb-1 block text-sm font-medium text-slate-700"
    >
      Descripción
    </label>

    <textarea
      id="member-description"
      pTextarea
      formControlName="description"
      rows="3"
      placeholder="Descripción del socio"
      class="w-full"
    ></textarea>
  </div>

  <div>
    <label
      for="member-active"
      class="mb-1 block text-sm font-medium text-slate-700"
    >
      Estado inicial
    </label>

    <p-select
      inputId="member-active"
      formControlName="isActive"
      [options]="activeOptions"
      optionLabel="label"
      optionValue="value"
      [fluid]="true"
    />

    @if (member()) {
      <p class="mt-1 text-xs text-slate-500">
        Para cambiar el estado de un socio existente, utiliza la operación
        de desactivación.
      </p>
    }
  </div>

  <div class="flex justify-end gap-2 border-t border-slate-100 pt-4">
    <button
      pButton
      type="button"
      severity="secondary"
      outlined
      [disabled]="saving()"
      (click)="cancelled.emit()"
    >
      <span pButtonLabel>Cancelar</span>
    </button>

    <button
      pButton
      type="submit"
      [loading]="saving()"
      [disabled]="saving()"
    >
      <i pButtonIcon class="pi pi-check"></i>
      <span pButtonLabel>Guardar</span>
    </button>
  </div>
</form>
