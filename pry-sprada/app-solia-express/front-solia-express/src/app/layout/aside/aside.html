<aside class="flex h-full min-h-0 flex-col bg-white">
  <p class="px-5 pb-3 pt-6 text-xs font-semibold tracking-wider text-slate-400">
    MENÚ PRINCIPAL
  </p>

  <nav aria-label="Navegación principal" class="min-h-0 flex-1 space-y-1 overflow-y-auto px-3">
    @for (item of items(); track item.label) {
      @if (item.routerLink === '/admin/usuarios') {
        <div class="mx-2 mb-2 mt-5 border-t border-slate-200 pt-4">
          <p class="px-1 pb-2 text-[10px] font-semibold tracking-widest text-slate-400">
            ADMINISTRACIÓN Y AUTENTICACIÓN
          </p>
        </div>
      }

      <a
        [routerLink]="item.routerLink"
        routerLinkActive="bg-blue-50 text-blue-700"
        [routerLinkActiveOptions]="{ exact: item.routerLink === '/' }"
        (click)="navigated.emit()"
        class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm text-slate-600 transition-colors hover:bg-slate-100"
      >
        @if (item.icon) {
          <i [class]="item.icon" aria-hidden="true"></i>
        }
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="border-t border-slate-100 px-5 py-4 text-xs text-slate-400">
    Gestión financiera solidaria
  </div>
</aside>
