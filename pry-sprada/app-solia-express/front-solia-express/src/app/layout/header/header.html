<header class="flex min-h-16 items-center gap-4 border-b border-slate-200 bg-white px-4 sm:px-6">
  <button
    type="button"
    class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg text-slate-600 hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2"
    aria-label="Abrir o cerrar menú"
    (click)="menuRequested.emit()"
  >
    <i class="pi pi-bars text-xl" aria-hidden="true"></i>
  </button>

  <div class="flex min-w-0 items-center gap-3">
    <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-blue-700 font-bold text-white">
      SE
    </span>
    <div class="min-w-0">
      <p class="truncate font-semibold text-slate-900">Solia Express</p>
      <p class="truncate text-xs text-slate-500">Fondo Solidario</p>
    </div>
  </div>

  <div class="ml-auto flex min-w-0 items-center gap-3">
    <div class="hidden text-right sm:block">
      <p class="max-w-48 truncate text-sm font-medium text-slate-800">
        {{ user()?.username || 'Usuario' }}
      </p>
      <p class="max-w-48 truncate text-xs text-slate-500">
        {{ user()?.email || 'Panel de administración' }}
      </p>
    </div>

    @if (authEnabled()) {
      <button
        type="button"
        class="flex h-10 shrink-0 items-center gap-2 rounded-lg border border-slate-200 px-3 text-sm font-medium text-slate-600 hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2"
        aria-label="Cerrar sesión"
        title="Cerrar sesión"
        (click)="logoutRequested.emit()"
      >
        <i class="pi pi-sign-out" aria-hidden="true"></i>
        <span class="hidden sm:inline">Salir</span>
      </button>
    }
  </div>
</header>
